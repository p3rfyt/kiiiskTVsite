<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>История матчей — kiiiskTV</title>
    <link rel="stylesheet" href="style.css?v=4">
    <link rel="stylesheet" href="matches-history.css?v=1">
</head>
<body class="page-body">

    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo-link">
                <div class="logo-badge">k</div>
                <span class="logo-text">kiiisk<span class="logo-highlight">TV</span></span>
            </a>

            <nav class="nav-links">
                <a href="index.html" class="nav-item">Главная</a>
                <a href="players.html" class="nav-item">Kiiisk рейтинг</a>
                <a href="all-players.html" class="nav-item">Все игроки</a>
                <a href="tournaments.html" class="nav-item">Турниры</a>
                <a href="matches-history.html" class="nav-item nav-item-active">История матчей</a>
            </nav>
        </div>
    </header>

    <main class="main-container matches-page">
        <section class="matches-intro">
            <div>
                <h1>История матчей</h1>
                <p>Результаты, составы и индивидуальная статистика игроков.</p>
            </div>
        </section>

        <section id="matchesList" class="matches-list" aria-live="polite"></section>
    </main>

    <footer class="footer">
        <p>© 2026 kiiiskTV — Создатель Perf.</p>
    </footer>

    <script src="data/matches.js"></script>
    <script>
        const matches = Array.isArray(window.KIIISK_MATCHES)
            ? [...window.KIIISK_MATCHES].sort((a, b) => String(b.date).localeCompare(String(a.date)))
            : [];

        const list = document.getElementById('matchesList');

        function escapeHtml(value) {
            return String(value ?? '')
                .replaceAll('&', '&amp;')
                .replaceAll('<', '&lt;')
                .replaceAll('>', '&gt;')
                .replaceAll('"', '&quot;')
                .replaceAll("'", '&#039;');
        }

        function formatDate(value) {
            const date = new Date(`${value}T00:00:00`);
            if (Number.isNaN(date.getTime())) return value || 'Дата не указана';

            return new Intl.DateTimeFormat('ru-RU', {
                day: '2-digit',
                month: 'long',
                year: 'numeric'
            }).format(date);
        }

        function teamName(match, side) {
            return match.teamNames?.[side] || `Команда ${side === 'team1' ? '1' : '2'}`;
        }

        function roster(match, side) {
            const players = Array.isArray(match.teams?.[side]) ? match.teams[side] : [];
            return players.length ? players.map(escapeHtml).join(' · ') : 'Состав не указан';
        }

        function playerRows(match, side) {
            const players = Array.isArray(match.teams?.[side]) ? match.teams[side] : [];
            const score1 = Number(match.score?.team1) || 0;
            const score2 = Number(match.score?.team2) || 0;
            const won = side === 'team1' ? score1 > score2 : score2 > score1;

            return players.map((id) => {
                const stat = match.players?.[id] || {};
                const kills = Number(stat.kills) || 0;
                const deaths = Number(stat.deaths) || 0;
                const assists = Number(stat.assists) || 0;
                const kd = deaths === 0 ? kills : kills / deaths;

                return `
                    <tr class="${won ? 'winner-player' : ''}">
                        <td>${escapeHtml(id)}</td>
                        <td>${kills}</td>
                        <td>${deaths}</td>
                        <td>${assists}</td>
                        <td>${kd.toFixed(2)}</td>
                    </tr>
                `;
            }).join('');
        }

        function renderMatch(match) {
            const score1 = Number(match.score?.team1) || 0;
            const score2 = Number(match.score?.team2) || 0;
            const map = match.map ? ` · ${escapeHtml(match.map)}` : '';

            return `
                <article class="match-history-card">
                    <div class="match-history-head">
                        <span class="match-history-tournament">${escapeHtml(match.tournament || 'Турнир не указан')}</span>
                        <span class="match-history-date">${formatDate(match.date)}${map}</span>
                    </div>

                    <div class="match-history-main">
                        <div class="match-history-team">
                            <div class="match-history-team-name">${escapeHtml(teamName(match, 'team1'))}</div>
                            <div class="match-history-roster">${roster(match, 'team1')}</div>
                        </div>

                        <div class="match-history-score">
                            <strong>${score1}:${score2}</strong>
                            <span>${score1 === score2 ? 'Ничья' : 'Завершён'}</span>
                        </div>

                        <div class="match-history-team">
                            <div class="match-history-team-name">${escapeHtml(teamName(match, 'team2'))}</div>
                            <div class="match-history-roster">${roster(match, 'team2')}</div>
                        </div>
                    </div>

                    <div class="match-history-stats">
                        <div class="match-history-stats-title">Статистика игроков</div>
                        <table class="match-player-table">
                            <thead>
                                <tr>
                                    <th>Игрок</th>
                                    <th>K</th>
                                    <th>D</th>
                                    <th>A</th>
                                    <th>K/D</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${playerRows(match, 'team1')}
                                ${playerRows(match, 'team2')}
                            </tbody>
                        </table>
                    </div>
                </article>
            `;
        }

        list.innerHTML = matches.length
            ? matches.map(renderMatch).join('')
            : `
                <div class="match-history-empty">
                    <strong>Матчей пока нема</strong>
                    
                </div>
            `;
    </script>
</body>
</html>
