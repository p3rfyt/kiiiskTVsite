<!DOCTYPE html>

<body class="page-body fame-page-bg">

    <div class="fame-side-glow glow-left"></div>
    <div class="fame-side-glow glow-right"></div>

    <!-- Шапка -->
    <header class="header">
        <div class="header-container">
            <a href="index.html" class="logo-link">

    <main class="main-container">

                    <div class="fame-player">
                        <div class="fame-avatar-wrapper">
                            <img src="Image/Players/n1kson1kLEG.png" alt="n1kson1k" class="fame-avatar">
