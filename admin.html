<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kiiiskTV — Admin</title>
    <style>
        :root {
            --bg: #0d0f10;
            --card: #151819;
            --line: #292d2f;
            --text: #f2f4f5;
            --muted: #8e969a;
            --accent: #b7ff2a;
            --danger: #ff7070;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font: 14px/1.45 Arial, sans-serif;
        }

        .wrap {
            max-width: 1100px;
            margin: 0 auto;
            padding: 28px 18px 60px;
        }

        .head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 22px;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
        }

        .logo b {
            color: var(--accent);
        }

        .status {
            color: var(--muted);
            text-align: right;
        }

        .card {
            margin-bottom: 16px;
            padding: 20px;
            background: var(--card);
            border: 1px solid var(--line);
            border-radius: 12px;
        }

        h1,
        h2 {
            margin: 0 0 14px;
        }

        h1 {
            font-size: 25px;
        }

        h2 {
            font-size: 16px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .description {
            color: var(--muted);
            margin: 0 0 16px;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field.full {
            grid-column: 1 / -1;
        }

        label {
            color: var(--muted);
            font-size: 12px;
        }

        input,
        select {
            width: 100%;
            padding: 11px;
            background: #0e1011;
            color: var(--text);
            border: 1px solid var(--line);
            border-radius: 8px;
            outline: none;
        }

        input:focus,
        select:focus {
            border-color: var(--accent);
        }

        .players {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .player {
            padding: 12px;
            border: 1px solid var(--line);
            border-radius: 10px;
        }

        .player strong {
            display: block;
            margin-bottom: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        button {
            padding: 11px 16px;
            background: var(--accent);
            color: #0b0d0e;
            border: 0;
            border-radius: 8px;
            font-weight: 800;
            cursor: pointer;
        }

        button.secondary {
            background: #24292b;
            color: var(--text);
            border: 1px solid var(--line);
        }

        button:disabled {
            cursor: not-allowed;
            opacity: 0.45;
        }

        .preview {
            color: var(--muted);
            font-size: 13px;
        }

        .ok {
            color: var(--accent);
        }

        .err {
            color: var(--danger);
        }

        @media (max-width: 700px) {
            .grid,
            .players {
                grid-template-columns: 1fr;
            }

            .field.full {
                grid-column: auto;
            }

            .head {
                align-items: flex-start;
                flex-direction: column;
            }

            .status {
                text-align: left;
            }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <header class="head">
            <div class="logo">kiiisk<b>TV</b> ADMIN</div>
            <div id="status" class="status">Файл не открыт</div>
        </header>

        <section class="card">
            <h1>Добавление матча</h1>
            <p class="description">
                Админка работает локально. Она не использует серверы или сторонние сервисы.
                Открой файл data/matches.js, добавляй матчи и сохраняй его. После этого GitHub Desktop
                увидит изменение.
            </p>

            <div class="buttons">
                <button id="open" type="button">Открыть matches.js</button>
                <button id="save" class="secondary" type="button" disabled>
                    Сохранить matches.js
                </button>
            </div>
        </section>

        <form id="form" class="card">
            <h2>Новый матч</h2>

            <div class="grid">
                <div class="field">
                    <label for="date">Дата</label>
                    <input id="date" type="date" required>
                </div>

                <div class="field">
                    <label for="tournament">Турнир</label>
                    <input id="tournament" placeholder="Kiiisk Cup" required>
                </div>

                <div class="field">
                    <label for="map">Карта</label>
                    <input id="map" placeholder="Mirage">
                </div>

                <div class="field">
                    <label for="teamName1">Название команды 1</label>
                    <input id="teamName1" placeholder="Perf Team" required>
                </div>

                <div class="field">
                    <label for="teamName2">Название команды 2</label>
                    <input id="teamName2" placeholder="Opponent" required>
                </div>

                <div class="field">
                    <label for="score1">Счёт команды 1</label>
                    <input id="score1" type="number" min="0" required>
                </div>

                <div class="field">
                    <label for="score2">Счёт команды 2</label>
                    <input id="score2" type="number" min="0" required>
                </div>

                <div class="field">
                    <label for="team1">Команда 1 — игроки через запятую</label>
                    <input id="team1" placeholder="perf, pinkman" required>
                </div>

                <div class="field">
                    <label for="team2">Команда 2 — игроки через запятую</label>
                    <input id="team2" placeholder="mismi13, n1kson1k" required>
                </div>
            </div>

            <h2 style="margin-top: 20px;">Статистика игроков</h2>
            <div id="players" class="players"></div>

            <div class="buttons" style="margin-top: 16px;">
                <button type="submit">Добавить матч</button>
                <button id="reset" class="secondary" type="button">Очистить</button>
            </div>

            <p id="message" class="preview"></p>
        </form>
    </div>

    <script>
        let fileHandle = null;
        let matches = [];

        const $ = (id) => document.getElementById(id);
        const status = $('status');
        const message = $('message');

        function parseMatches(text) {
            const match = text.match(
                /const\s+KIIISK_MATCHES\s*=\s*(\[[\s\S]*?\]);/
            );

            if (!match) {
                throw new Error('Не найден массив KIIISK_MATCHES');
            }

            return Function(`"use strict"; return (${match[1]})`)();
        }

        function makeText(data) {
            return `// kiiiskTV — матчи\nconst KIIISK_MATCHES = ${JSON.stringify(data, null, 2)};\n`;
        }

        function getPlayerIds() {
            const team1 = $('team1').value.split(',');
            const team2 = $('team2').value.split(',');

            return [...new Set(
                [...team1, ...team2]
                    .map((id) => id.trim())
                    .filter(Boolean)
            )];
        }

        function renderPlayers() {
            $('players').innerHTML = getPlayerIds().map((id) => `
                <div class="player">
                    <strong>${id}</strong>
                    <div class="stats">
                        <div class="field">
                            <label>Kills</label>
                            <input data-id="${id}" data-stat="kills" type="number" min="0" value="0">
                        </div>
                        <div class="field">
                            <label>Deaths</label>
                            <input data-id="${id}" data-stat="deaths" type="number" min="0" value="0">
                        </div>
                        <div class="field">
                            <label>Assists</label>
                            <input data-id="${id}" data-stat="assists" type="number" min="0" value="0">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        $('team1').addEventListener('input', renderPlayers);
        $('team2').addEventListener('input', renderPlayers);

        $('open').addEventListener('click', async () => {
            try {
                if (!window.showOpenFilePicker) {
                    throw new Error('Открой admin.html в Google Chrome или Edge на компьютере.');
                }

                [fileHandle] = await showOpenFilePicker({
                    multiple: false,
                    types: [{
                        description: 'JavaScript',
                        accept: { 'text/javascript': ['.js'] }
                    }]
                });

                const file = await fileHandle.getFile();
                matches = parseMatches(await file.text());

                $('save').disabled = false;
                status.textContent = `Открыт: ${file.name} • матчей: ${matches.length}`;
                message.textContent = 'Файл загружен.';
                message.className = 'preview ok';
            } catch (error) {
                message.textContent = error.message;
                message.className = 'preview err';
            }
        });

        $('save').addEventListener('click', async () => {
            try {
                if (!fileHandle) {
                    throw new Error('Сначала открой matches.js');
                }

                const writable = await fileHandle.createWritable();
                await writable.write(makeText(matches));
                await writable.close();

                status.textContent = `Сохранено • матчей: ${matches.length}`;
                message.textContent = 'Готово. Теперь GitHub Desktop должен показать изменённый matches.js.';
                message.className = 'preview ok';
            } catch (error) {
                message.textContent = error.message;
                message.className = 'preview err';
            }
        });

        $('form').addEventListener('submit', (event) => {
            event.preventDefault();

            if (!fileHandle) {
                message.textContent = 'Сначала нажми «Открыть matches.js».';
                message.className = 'preview err';
                return;
            }

            const team1 = $('team1').value
                .split(',')
                .map((id) => id.trim())
                .filter(Boolean);

            const team2 = $('team2').value
                .split(',')
                .map((id) => id.trim())
                .filter(Boolean);

            const players = {};

            document.querySelectorAll('[data-id]').forEach((input) => {
                const id = input.dataset.id;
                players[id] ??= { kills: 0, deaths: 0, assists: 0 };
                players[id][input.dataset.stat] = Number(input.value) || 0;
            });

            matches.push({
                id: Date.now().toString(36),
                date: $('date').value,
                tournament: $('tournament').value.trim(),
                map: $('map').value.trim(),
                teamNames: {
                    team1: $('teamName1').value.trim(),
                    team2: $('teamName2').value.trim()
                },
                score: {
                    team1: Number($('score1').value) || 0,
                    team2: Number($('score2').value) || 0
                },
                teams: { team1, team2 },
                players
            });

            status.textContent = `Изменения в памяти • матчей: ${matches.length}`;
            message.textContent = 'Матч добавлен. Теперь нажми «Сохранить matches.js».';
            message.className = 'preview ok';
        });

        $('reset').addEventListener('click', () => {
            $('form').reset();
            $('date').value = new Date().toISOString().slice(0, 10);
            renderPlayers();
        });

        $('date').value = new Date().toISOString().slice(0, 10);
        renderPlayers();
    </script>
</body>
</html>
