<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>kiiiskTV Admin</title>
<style>
:root{--bg:#0d0f10;--card:#151819;--line:#292d2f;--text:#f2f4f5;--muted:#8e969a;--accent:#b7ff2a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,sans-serif}
.wrap{max-width:1100px;margin:0 auto;padding:28px 18px 60px}.head{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}
.logo{font-size:22px;font-weight:900}.logo b{color:var(--accent)}.status{color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
h1,h2{margin:0 0 14px}h1{font-size:25px}h2{font-size:16px;text-transform:uppercase;letter-spacing:.04em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}label{color:var(--muted);font-size:12px}
input,select{width:100%;background:#0e1011;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:11px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
.players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.player{border:1px solid var(--line);border-radius:10px;padding:12px}.player strong{display:block;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.buttons{display:flex;gap:10px;flex-wrap:wrap}
button{border:0;border-radius:8px;padding:11px 16px;font-weight:800;cursor:pointer;background:var(--accent);color:#0b0d0e}
button.secondary{background:#24292b;color:var(--text);border:1px solid var(--line)}
.preview{color:var(--muted);font-size:13px}.ok{color:var(--accent)}.err{color:#ff7070}
@media(max-width:700px){.grid,.players{grid-template-columns:1fr}.field.full{grid-column:auto}}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="logo">kiiisk<b>TV</b> ADMIN</div>
    <div id="status" class="status">Файл не открыт</div>
  </div>

  <div class="card">
    <h1>Статистика матчей</h1>
    <p class="preview">Админка работает локально. Она не использует серверы или сторонние сервисы. Открой файл <b>data/matches.js</b>, добавляй матчи и сохраняй его. После этого GitHub Desktop увидит изменение.</p>
    <div class="buttons">
      <button id="open">Открыть matches.js</button>
      <button id="save" class="secondary" disabled>Сохранить matches.js</button>
    </div>
  </div>

  <form id="form" class="card">
    <h2>Новый матч</h2>
    <div class="grid">
      <div class="field"><label>Дата</label><input id="date" type="date" required></div>
      <div class="field"><label>Турнир</label><input id="tournament" placeholder="Kiiisk Cup" required></div>
      <div class="field"><label>Счёт команды 1</label><input id="score1" type="number" min="0" required></div>
      <div class="field"><label>Счёт команды 2</label><input id="score2" type="number" min="0" required></div>
      <div class="field"><label>Команда 1 — игроки через запятую</label><input id="team1" placeholder="p3rf, pinkman" required></div>
      <div class="field"><label>Команда 2 — игроки через запятую</label><input id="team2" placeholder="mismi13, n1kson1k" required></div>
    </div>

    <h2 style="margin-top:20px">Статистика игроков</h2>
    <div id="players" class="players"></div>

    <div class="buttons" style="margin-top:16px">
      <button type="submit">Добавить матч</button>
      <button type="button" id="reset" class="secondary">Очистить</button>
    </div>
    <p id="message" class="preview"></p>
  </form>
</div>

<script>
let fileHandle = null;
let matches = [];

const $ = id => document.getElementById(id);
const status = $('status'), message = $('message');

function parseMatches(text){
  const m = text.match(/const\\s+KIIISK_MATCHES\\s*=\\s*(\\[[\\s\\S]*?\\]);/);
  if(!m) throw new Error('Не найден массив KIIISK_MATCHES');
  return Function('"use strict"; return (' + m[1] + ')')();
}
function makeText(data){
  return `// kiiiskTV — матчи\\nconst KIIISK_MATCHES = ${JSON.stringify(data,null,2)};\\n`;
}
function ids(){
  return [...new Set(
    [...$('team1').value.split(','), ...$('team2').value.split(',')]
      .map(x=>x.trim()).filter(Boolean)
  )];
}
function renderPlayers(){
  $('players').innerHTML = ids().map(id => `
    <div class="player">
      <strong>${id}</strong>
      <div class="stats">
        <div class="field"><label>Kills</label><input data-id="${id}" data-k="kills" type="number" min="0" value="0"></div>
        <div class="field"><label>Deaths</label><input data-id="${id}" data-k="deaths" type="number" min="0" value="0"></div>
        <div class="field"><label>Assists</label><input data-id="${id}" data-k="assists" type="number" min="0" value="0"></div>
      </div>
    </div>`).join('');
}
$('team1').addEventListener('input',renderPlayers);
$('team2').addEventListener('input',renderPlayers);

$('open').onclick = async () => {
  try{
    if(!window.showOpenFilePicker) throw new Error('Открой admin.html в Google Chrome/Edge на компьютере.');
    [fileHandle] = await showOpenFilePicker({
      multiple:false,
      types:[{description:'JavaScript',accept:{'text/javascript':['.js']}}]
    });
    const file = await fileHandle.getFile();
    const text = await file.text();
    matches = parseMatches(text);
    $('save').disabled = false;
    status.textContent = `Открыт: ${file.name} • матчей: ${matches.length}`;
    message.textContent = 'Файл загружен.';
    message.className='preview ok';
  }catch(e){message.textContent=e.message;message.className='preview err';}
};

$('save').onclick = async () => {
  try{
    if(!fileHandle) throw new Error('Сначала открой matches.js');
    const writable = await fileHandle.createWritable();
    await writable.write(makeText(matches));
    await writable.close();
    status.textContent = `Сохранено • матчей: ${matches.length}`;
    message.textContent = 'Готово. Теперь открой GitHub Desktop: он должен показать изменённый matches.js.';
    message.className='preview ok';
  }catch(e){message.textContent=e.message;message.className='preview err';}
};

$('form').onsubmit = e => {
  e.preventDefault();
  if(!fileHandle){message.textContent='Сначала нажми «Открыть matches.js».';message.className='preview err';return;}
  const team1=$('team1').value.split(',').map(x=>x.trim()).filter(Boolean);
  const team2=$('team2').value.split(',').map(x=>x.trim()).filter(Boolean);
  const players={};
  document.querySelectorAll('[data-id]').forEach(input=>{
    const id=input.dataset.id;
    players[id] ??= {kills:0,deaths:0,assists:0};
    players[id][input.dataset.k]=Number(input.value)||0;
  });
  matches.push({
    id: Date.now().toString(36),
    date: $('date').value,
    tournament: $('tournament').value.trim(),
    score:{team1:Number($('score1').value)||0,team2:Number($('score2').value)||0},
    teams:{team1,team2},
    players
  });
  status.textContent = `Изменения в памяти • матчей: ${matches.length}`;
  message.textContent = 'Матч добавлен. Нажми «Сохранить matches.js».';
  message.className='preview ok';
};
$('reset').onclick=()=>{$('form').reset();renderPlayers()};
$('date').value=new Date().toISOString().slice(0,10);
renderPlayers();
</script>
</body>
</html>
